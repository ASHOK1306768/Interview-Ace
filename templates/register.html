{% extends "base.html" %}

{% block title %}Create Account - InterviewAce{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-7 col-lg-6">
        <div class="glass-panel-glow p-4 p-md-5 border border-purple-500 shadow-lg">
            <div class="text-center mb-4">
                <div class="btn-gradient rounded-4 d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 54px; height: 54px;">
                    <span class="fs-2 fw-black text-white">A</span>
                </div>
                <h3 class="fw-black text-white mb-1">Create Account</h3>
                <p class="text-cyan small">Join InterviewAce Mock Interview Platform</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST" id="registerForm">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-gray-300 small fw-semibold">Full Name</label>
                        <input type="text" name="full_name" value="{{ full_name if full_name else '' }}" class="form-control" placeholder="John Doe" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-gray-300 small fw-semibold">Username</label>
                        <input type="text" name="username" value="{{ username if username else '' }}" class="form-control" placeholder="johndoe" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-gray-300 small fw-semibold">Email Address</label>
                    <input type="email" name="email" value="{{ email if email else '' }}" class="form-control" placeholder="name@example.com" required>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-gray-300 small fw-semibold">Password</label>
                        <input type="password" name="password" id="regPassword" class="form-control" placeholder="Min 6 characters" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-gray-300 small fw-semibold">Confirm Password</label>
                        <input type="password" name="confirm_password" id="regConfirmPassword" class="form-control" placeholder="Re-type password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-2.5 rounded-3 mb-3 shadow">
                    Register & Send Email OTP
                </button>
            </form>

            <div class="text-center small text-gray-400 mt-3">
                Already have an account? 
                <a href="{{ url_for('auth.login') }}" class="text-cyan text-decoration-none fw-bold ms-1">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
