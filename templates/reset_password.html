{% extends "base.html" %}

{% block title %}Reset Password - InterviewAce{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel-glow p-4 p-md-5 border border-purple-500 shadow-lg">
            <div class="text-center mb-4">
                <div class="btn-gradient rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 54px; height: 54px;">
                    <i class="bi bi-shield-check fs-3 text-white"></i>
                </div>
                <h3 class="fw-black text-white mb-1">Set New Password</h3>
                <p class="text-gray-400 small">Enter the 6-digit code sent to your email and your new password.</p>
            </div>

            <form action="{{ url_for('auth.reset_password') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-gray-300 small fw-semibold">Reset OTP Code</label>
                    <input type="text" name="otp" class="form-control otp-input" placeholder="000000" maxlength="6" required autofocus>
                </div>

                <div class="mb-3">
                    <label class="form-label text-gray-300 small fw-semibold">New Password</label>
                    <input type="password" name="new_password" class="form-control" placeholder="Min 6 characters" required>
                </div>

                <div class="mb-4">
                    <label class="form-label text-gray-300 small fw-semibold">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" placeholder="Re-type new password" required>
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-2.5 rounded-3 mb-3 shadow">
                    Reset Password & Sign In
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
