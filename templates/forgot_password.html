{% extends "base.html" %}

{% block title %}Forgot Password - InterviewAce{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-6 col-lg-5">
        <div class="glass-panel-glow p-4 p-md-5 border border-purple-500 shadow-lg">
            <div class="text-center mb-4">
                <div class="btn-gradient rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 54px; height: 54px;">
                    <i class="bi bi-key-fill fs-3 text-white"></i>
                </div>
                <h3 class="fw-black text-white mb-1">Forgot Password</h3>
                <p class="text-gray-400 small">Enter your email address to receive a password reset code.</p>
            </div>

            <form action="{{ url_for('auth.forgot_password') }}" method="POST">
                <div class="mb-4">
                    <label class="form-label text-gray-300 small fw-semibold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@example.com" required autofocus>
                </div>

                <button type="submit" class="btn btn-gradient w-100 py-2.5 rounded-3 mb-3 shadow">
                    Send Reset OTP Code
                </button>
            </form>

            <div class="text-center small">
                <a href="{{ url_for('auth.login') }}" class="text-cyan text-decoration-none fw-bold">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
